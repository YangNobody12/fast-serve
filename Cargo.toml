[package]
name = "qwen35_split_server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
futures-util = "0.3"
libloading = "0.8"
memmap2 = "0.9"
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

